<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <script src="https://kit.fontawesome.com/7d86f6057b.js" crossorigin="anonymous"></script>
    <script src="../js/onepiece.js" defer></script>
    <link rel="stylesheet" href="../styles/onepiece.css" />
    <link rel="icon" type="image/png" href="../images/logo.png" />
    <link rel="manifest" href="../manifest.json" />
    <title>Onepiecedle</title>
  </head>
  <body>
    <div class="shell">
      <header class="head">
        <div class="emblem">
          <span class="mark" aria-hidden="true">☠</span>
          <div>
            <h1>OnePiecedle</h1>
          </div>
        </div>
        <div class="actions">
          <a class="btn" href="../index.html" style="text-decoration: none"><i class="fa-solid fa-arrow-left"></i> Tutti i giochi</a>
          <button class="btn" id="reveal" type="button"><i class="fas fa-lightbulb"></i> Mostra soluzione</button>
          <button class="btn primary" id="newGame" type="button">
            <i class="fa-solid fa-rotate-right" style="color: rgb(255, 255, 255)"></i>
            Nuova partita
          </button>
        </div>
      </header>
      <main class="main">
        <h2>Indovina il personaggio di One Piece!</h2>

        <div class="search-area">
          <div class="search-line">
            <span class="glass" aria-hidden="true"><i class="fa-solid fa-magnifying-glass" style="color: rgb(0, 0, 0)"></i></span><input id="guessInput" type="text" placeholder="Cerca un personaggio…" autocomplete="off" autocapitalize="none" spellcheck="false" role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" aria-label="Nome del personaggio" /><button class="btn primary" id="guessBtn" type="button">
              Prova
              <i class="fa-solid fa-paper-plane" style="color: rgb(255, 255, 255)"></i>
            </button>
          </div>
          <div id="suggestions" class="suggestions" role="listbox" aria-label="Personaggi suggeriti"></div>
        </div>
        <div id="status" class="status" aria-live="polite" style="display: none"></div>
        <div id="endPanel" class="win" aria-live="polite">
          <strong id="endTitle"></strong>
          <p id="endText"></p>
          <button type="button" id="playAgain" class="btn primary">
            Gioca ancora
            <i class="fa-solid fa-rotate-right" style="color: rgb(255, 255, 255)"></i>
          </button>
        </div>
        <div class="table-scroll" role="region" aria-label="Tabella dei tentativi" tabindex="0">
          <table>
            <thead>
              <tr>
                <th>Personaggio</th>
                <th>Genere</th>
                <th>Affiliazione</th>
                <th>Frutto del<br />diavolo</th>
                <th>Haki</th>
                <th>Ultima<br />taglia</th>
                <th>Altezza</th>
                <th>Origine</th>
                <th>Primo arco</th>
              </tr>
            </thead>
            <tbody id="guessRows"></tbody>
          </table>
        </div>
        <div class="legend">
          <h3>Legenda degli indizi</h3>
          <div class="legend-grid">
            <div class="legend-item">
              <div class="legend-swatch g"></div>
              Corretto
            </div>
            <div class="legend-item">
              <div class="legend-swatch y"></div>
              Parziale
            </div>
            <div class="legend-item">
              <div class="legend-swatch r"></div>
              Non corretto
            </div>
            <div class="legend-item">
              <div class="legend-swatch r">
                <i class="fa-solid fa-arrow-up" style="color: rgb(255, 255, 255)"></i>
              </div>
              Più alto
            </div>
            <div class="legend-item">
              <div class="legend-swatch r">
                <i class="fa-solid fa-arrow-down" style="color: rgb(255, 255, 255)"></i>
              </div>
              Più basso
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
