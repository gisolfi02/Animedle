<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <script
      src="https://kit.fontawesome.com/7d86f6057b.js"
      crossorigin="anonymous"
    ></script>
    <title>Onepiecedle</title>
    <style>
      :root {
        --ink: #34261c;
        --muted: #665b51;
        --cream: #f7f0dd;
        --cream2: #fffbf3;
        --gold: #e0ac57;
        --maroon: #7f262a;
        --border: #b8a586;
        --green: #2d9b64;
        --yellow: #d5b943;
        --red: #cc4541;
        --blue: #297da0;
        --neutral: #7a7d82;
        --shadow: 0 14px 40px rgba(53, 37, 23, 0.19);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Arial,
          sans-serif;
        color: var(--ink);
      }
      body {
        background:
          linear-gradient(140deg, #fff8e6db, #f0e3c7dc),
          radial-gradient(circle at 12% 20%, #dfb474 0 3px, transparent 4px),
          #efe2c6;
        background-size:
          auto,
          38px 38px,
          auto;
      }
      body:before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.24;
        background: repeating-linear-gradient(
          27deg,
          transparent 0 77px,
          #b89b72 78px 79px,
          transparent 80px 153px
        );
        z-index: -1;
      }
      .shell {
        width: min(1220px, calc(100% - 34px));
        margin: 30px auto 60px;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        border: 2px solid #6d442e;
        border-radius: 16px;
        padding: 16px 20px;
        background: linear-gradient(135deg, #fffdf6, #f3e7cf);
        box-shadow: var(--shadow);
      }
      .emblem {
        display: flex;
        gap: 15px;
        align-items: center;
      }

      .emblem .mark {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        flex: 0 0 52px;
        border-radius: 50%;
        border: 2px solid #bd8c46;
        background: linear-gradient(135deg, #2a7fa0, #164566, #0b2e4c);
        color: #fff9e7;
        font-size: 31px;
        font-weight: 900;
        transform: rotate(-8deg);
        box-shadow: 0 2px 0 #c7a36a;
        padding-bottom: 7px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h2 {
        font-size: clamp(19px, 2.5vw, 28px);
        text-align: center;
        letter-spacing: 0.5px;
        font-family: Georgia, serif;
        color: #472d20;
      }

      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(22px, 3.2vw, 34px);
        line-height: 1.12;
        color: var(--maroon);
      }
      .sub {
        font-size: 14px;
        color: var(--muted);
        margin-top: 6px;
      }
      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .btn {
        padding: 10px 14px;
        border-radius: 9px;
        background: #fffaf0;
        border: 1.5px solid #886b52;
        color: #472d20;
        font-weight: 720;
        transition:
          transform 0.12s,
          background 0.12s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      .btn:hover {
        background: #ffe8bd;
        transform: translateY(-1px);
      }
      .btn:focus-visible,
      .result:focus-visible,
      input:focus-visible {
        outline: 3px solid #5a9ccd;
        outline-offset: 2px;
      }
      .btn.primary {
        background: var(--maroon);
        border-color: var(--maroon);
        color: #fff8ed;
      }
      .btn.primary:hover {
        background: #9b3b40;
      }
      .main {
        margin-top: 21px;
        padding: 25px 26px;
        background: var(--cream2);
        border: 2px solid #795b40;
        border-radius: 16px;
        box-shadow: var(--shadow);
        gap: 20px;
        display: grid;
        align-content: center;
        justify-items: center;
      }
      .game-title {
        font-family: Georgia, serif;
        letter-spacing: 1.1px;
        text-align: center;
        font-size: clamp(20px, 3vw, 30px);
        color: #472d20;
      }
      .instructions {
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        margin: 9px auto 22px;
        max-width: 660px;
        line-height: 1.5;
      }
      .search-area {
        position: relative;
        min-width: 690px;
        margin: 0 auto;
        z-index: 9;
      }
      .search-line {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 2px solid #a89473;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 4px 0 #e8dfce;
        padding: 5px;
      }
      .search-line .glass {
        font-size: 23px;
        padding-left: 10px;
        color: #846c4e;
      }
      input {
        width: 100%;
        font: inherit;
        min-width: 0;
        font-size: 17px;
        border: none;
        outline: none;
        flex: 1;
        padding: 13px 2px;
        color: var(--ink);
        background: transparent;
      }
      input::placeholder {
        color: #938b7f;
      }
      .search-line:focus-within {
        border-color: #377e9e;
      }
      .suggestions {
        position: absolute;
        top: calc(100% + 7px);
        left: 0;
        right: 0;
        max-height: 350px;
        overflow: auto;
        border: 2px solid #9d8566;
        border-radius: 12px;
        background: #fffefb;
        box-shadow: 0 13px 30px #38220d38;
        display: none;
      }
      .suggestions.show {
        display: block;
      }
      .result {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 13px;
        border: 0;
        background: #fffefb;
        text-align: left;
        color: var(--ink);
      }
      .result:hover,
      .result.active {
        background: #f5e2be;
      }
      .result + .result {
        border-top: 1px solid #eee0c8;
      }
      .small-avatar {
        width: 41px;
        height: 41px;
        flex: 0 0 41px;
        object-fit: cover;
        object-position: top;
        border-radius: 7px;
        border: 1px solid #b9a383;
        background: #e4d7c0;
      }
      .result-name {
        font-weight: 720;
      }
      .result-meta {
        font-size: 12px;
        color: var(--muted);
      }
      .empty {
        padding: 15px;
        color: #756453;
        font-size: 14px;
      }
      .status {
        min-height: 23px;
        text-align: center;
        color: #625546;
        font-size: 14px;
        margin: 14px 0 10px;
      }
      .win {
        max-width: 730px;
        margin: 17px auto 8px;
        background: #e9f7e6;
        border: 2px solid #5da778;
        border-radius: 12px;
        padding: 16px;
        text-align: center;
        display: none;
      }
      .win.show {
        display: block;
      }
      .win strong {
        font-size: 19px;
        color: #226240;
      }
      .win p {
        font-size: 14px;
        margin: 7px 0 13px;
        color: #365942;
      }
      .win.lost {
        background: #fff0e4;
        border-color: #cf8d58;
      }
      .win.lost strong {
        color: #923927;
      }
      .scroll-note {
        display: none;
        text-align: right;
        color: var(--muted);
        font-size: 12px;
        margin: 6px 0 4px;
      }
      .table-scroll {
        max-width: 100%;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        padding-bottom: 6px;
      }
      table {
        border-collapse: separate;
        border-spacing: 5px;
        width: 100%;
        table-layout: fixed;
        min-width: 850px;
      }
      thead th {
        font-weight: 850;
        text-transform: uppercase;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.22px;
        line-height: 1.15;
        vertical-align: bottom;
        padding: 0 3px 8px;
        border-bottom: 3px solid #574834;
      }
      th:first-child {
        width: 102px;
      }
      th:nth-child(2) {
        width: 91px;
      }
      th:nth-child(3) {
        width: 130px;
      }
      th:nth-child(4) {
        width: 104px;
      }
      th:nth-child(5) {
        width: 102px;
      }
      th:nth-child(6) {
        width: 107px;
      }
      th:nth-child(7) {
        width: 88px;
      }
      th:nth-child(8) {
        width: 112px;
      }
      th:nth-child(9) {
        width: 113px;
      }
      td {
        height: 104px;
        padding: 0;
        vertical-align: middle;
        text-align: center;
      }
      .tile {
        position: relative;
        min-height: 98px;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        border-radius: 9px;
        border: 2px solid #ffffff75;
        box-shadow: inset 0 -10px 0 #0000000d;
        padding: 7px 5px;
        text-shadow: 0 1px 2px #2228;
        color: #fff;
        font-weight: 740;
        line-height: 1.15;
        font-size: 14px;
        overflow: hidden;
        word-wrap: break-word;
        overflow-wrap: anywhere;
      }
      .tile.correct {
        background: var(--green);
      }
      .tile.partial {
        background: var(--yellow);
        color: #302c1c;
        text-shadow: none;
      }
      .tile.wrong {
        background: var(--red);
      }
      .tile.unknown {
        background: var(--neutral);
      }
      .tile .arrow {
        font-size: 30px;
        line-height: 1;
        margin: 2px 0;
        color: #fff;
        text-shadow: 0 2px 1px #0007;
      }
      .tile .num {
        font-size: 15px;
      }
      .tile .tiny {
        font-size: 11px;
        margin-top: 4px;
        line-height: 1.1;
      }
      .character-tile {
        background: #e4bd7c !important;
        border-color: #6e5135;
        padding: 0;
      }
      .character-tile img {
        width: 100%;
        height: 74px;
        object-fit: contain;
        object-position: top;
        display: block;
        background: #f0deb9;
      }
      .character-name {
        font-size: 11px;
        line-height: 1.13;
        padding: 3px;
        color: #32241d;
        text-shadow: none;
        background: #eddbb9;
        width: 100%;
        min-height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .character-tile.hit {
        border: 3px solid #2ca45f;
      }
      .legend {
        max-width: 780px;
        margin: 23px auto 2px;
        border: 1.5px solid #b69d79;
        background: #f7ecda;
        border-radius: 13px;
        padding: 14px 16px;
      }
      .legend h3 {
        text-align: center;
        margin-bottom: 11px;
        font-family: Georgia, serif;
        font-size: 17px;
      }
      .legend-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }
      .legend-item {
        text-align: center;
        font-size: 12px;
        font-weight: 720;
        line-height: 1.15;
      }
      .legend-swatch {
        display: grid;
        place-items: center;
        font-size: 23px;
        color: #fff;
        width: 36px;
        height: 33px;
        border-radius: 5px;
        margin: 0 auto 5px;
      }
      .legend-swatch.g {
        background: var(--green);
      }
      .legend-swatch.y {
        background: var(--yellow);
      }
      .legend-swatch.r {
        background: var(--red);
      }
      .legend-swatch.n {
        background: var(--neutral);
      }
      .legend-item:last-child {
        grid-column: auto;
      }
      .source {
        margin: 17px auto 0;
        max-width: 820px;
        text-align: center;
        font-size: 12px;
        color: #6f6053;
        line-height: 1.5;
      }
      .source a {
        color: #5e3d33;
      }
      @media (max-width: 840px) {
        .shell {
          width: calc(100% - 20px);
          margin: 10px auto 25px;
        }
        .head {
          padding: 13px;
        }
        .head .mark {
          width: 39px;
          height: 39px;
          font-size: 20px;
        }
        h1 {
          font-size: 22px;
        }
        .head {
          align-items: flex-start;
        }
        .main {
          padding: 17px 10px;
        }
        .scroll-note {
          display: block;
        }
        .legend-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          row-gap: 14px;
        }
        .btn {
          padding: 8px 10px;
          font-size: 12px;
        }
        .search-area {
          min-width: 100%;
        }
        .legend {
          min-width: 100%;
        }
      }
      @media (max-width: 520px) {
        .head {
          flex-direction: column;
          align-items: stretch;
          gap: 8px;
        }
        .head .actions {
          justify-content: flex-end;
        }
        input {
          font-size: 15px;
        }
        .search-area {
          min-width: 100%;
        }
        .legend {
          min-width: 100%;
        }
        .instructions {
          margin-bottom: 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .btn {
          transition: none;
        }
      }

      /* ================================================================
         ONEPIECEDLE — GRAND LINE / MAPPA DEL TESORO
         Intervento esclusivamente grafico. Nessuna modifica a JS/dataset.
         ================================================================ */
      :root {
        --ink: #29281f;
        --muted: #715d42;
        --cream: #f2e3bc;
        --cream2: #f8efdb;
        --gold: #d8a54a;
        --maroon: #aa3830;
        --border: #a37c42;
        --green: #269564;
        --yellow: #d7aa35;
        --red: #c4433b;
        --blue: #176d86;
        --neutral: #6e797a;
        --shadow: 0 20px 42px rgba(3, 21, 32, 0.3);
        --ocean: #082b3b;
        --deep-ocean: #061c2d;
        --paper: #f7ecd0;
        --rope: #bd9153;
      }

      html {
        scroll-behavior: smooth;
      }
      body {
        color: var(--ink);
        background:
          radial-gradient(
            ellipse at 75% 4%,
            rgba(55, 150, 168, 0.24),
            transparent 43%
          ),
          radial-gradient(
            ellipse at 13% 72%,
            rgba(35, 118, 146, 0.27),
            transparent 43%
          ),
          repeating-radial-gradient(
            ellipse at 10% 100%,
            transparent 0 30px,
            rgba(149, 213, 216, 0.065) 31px 33px,
            transparent 34px 65px
          ),
          linear-gradient(155deg, #0b4353 0%, #092c41 38%, #051e30 100%);
        background-attachment: fixed;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        opacity: 0.23;
        background-image:
          repeating-linear-gradient(
            0deg,
            transparent 0 89px,
            #b2e0d337 90px,
            transparent 91px 179px
          ),
          repeating-linear-gradient(
            90deg,
            transparent 0 89px,
            #b2e0d337 90px,
            transparent 91px 179px
          );
      }
      body::after {
        content: "✦";
        position: fixed;
        right: -58px;
        bottom: -150px;
        font-size: min(48vw, 590px);
        color: rgba(215, 178, 107, 0.08);
        font-family: Georgia, serif;
        line-height: 1;
        pointer-events: none;
        z-index: -1;
      }
      .shell {
        position: relative;
      }
      .head {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 92% 0,
            rgba(75, 150, 159, 0.28),
            transparent 40%
          ),
          linear-gradient(120deg, #092b40, #0e4353 57%, #092b3d);
        border: 2px solid #bf9959;
        box-shadow:
          0 6px 0 #062333,
          0 16px 36px #00182266,
          inset 0 0 0 3px #ffffff0c;
        border-radius: 17px;
      }
      .head::after {
        content: "";
        position: absolute;
        inset: 7px;
        border: 1px dashed rgba(228, 194, 129, 0.38);
        border-radius: 10px;
        pointer-events: none;
      }
      .emblem {
        position: relative;
        z-index: 1;
      }
      .emblem .mark {
        width: 59px;
        height: 59px;
        flex: 0 0 59px;
        background: radial-gradient(
          circle at 30% 22%,
          #26768b,
          #104054 55%,
          #071f31
        );
        border: 3px solid #eac478;
        box-shadow:
          0 0 0 3px #082535,
          0 3px 10px #0008,
          inset 0 0 0 2px #ffffff25;
        color: #fff4d6;
        font-size: 33px;
        text-shadow: 0 2px 3px #0008;
        transform: rotate(-9deg);
      }
      .head h1 {
        color: #f8df9b;
        text-shadow:
          0 2px 0 #573b21,
          0 3px 12px #061824;
        font-weight: 800;
        letter-spacing: 0.25px;
      }
      .head .actions {
        position: relative;
        z-index: 1;
      }
      .head .btn {
        color: #fff1cf;
        background: rgba(5, 37, 54, 0.72);
        border: 1.5px solid #b8975a;
        box-shadow: inset 0 1px 0 #ffffff1d;
      }
      .head .btn i {
        color: currentColor !important;
      }
      .head .btn:hover {
        background: #175267;
      }
      .btn.primary,
      .head .btn.primary {
        background: linear-gradient(180deg, #ba493c, #8d2925);
        color: #fff6df;
        border-color: #e1a85f;
        box-shadow:
          inset 0 1px 0 #ffffff48,
          0 3px 0 #602b21;
      }
      .btn.primary:hover,
      .head .btn.primary:hover {
        background: linear-gradient(180deg, #ce5847, #a3372d);
      }
      .main {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        background:
          radial-gradient(circle at 0 0, #ddc19266, transparent 26%),
          radial-gradient(circle at 100% 90%, #ddc19255, transparent 34%),
          repeating-linear-gradient(
            0deg,
            transparent 0 47px,
            #8b6b3520 48px,
            transparent 49px
          ),
          repeating-linear-gradient(
            90deg,
            transparent 0 47px,
            #8b6b3520 48px,
            transparent 49px
          ),
          linear-gradient(140deg, #fff6dc 0%, #f4e6c5 55%, #eddaad 100%);
        border: 3px solid #c39855;
        outline: 1px solid #112e3d;
        box-shadow:
          0 21px 45px #031a2c80,
          inset 0 0 0 6px #ffecc070;
        border-radius: 16px;
      }
      /* Rosa dei venti decorativa, disegnata senza immagini esterne. */
      .main::before {
        content: "✧";
        position: absolute;
        right: 4px;
        top: -102px;
        font:
          260px/1 Georgia,
          serif;
        color: rgba(139, 94, 38, 0.075);
        pointer-events: none;
        z-index: -1;
      }
      .main::after {
        content: "";
        position: absolute;
        inset: 11px;
        border: 1px dashed rgba(143, 102, 51, 0.3);
        border-radius: 8px;
        pointer-events: none;
        z-index: -1;
      }
      .main > * {
        max-width: 100%;
      }
      .main h2 {
        color: #123c50;
        text-shadow: 0 1px #fff9e8;
      }
      .main h2::after {
        content: "◆  ·  ✦  ·  ◆";
        display: block;
        margin-top: 9px;
        color: #b4823c;
        font-size: 12px;
        letter-spacing: 7px;
        text-shadow: none;
      }
      .instructions {
        color: #6c593e;
      }
      .search-line {
        background: #fffbec;
        border: 2px solid #b58b4e;
        box-shadow:
          0 4px 0 #bd91546b,
          0 10px 23px #4634171c;
      }
      .search-line:focus-within {
        border-color: #14718d;
        box-shadow:
          0 0 0 3px #328ca522,
          0 4px 0 #bd91546b;
      }
      .search-line .glass {
        color: #1c6478;
      }
      .search-line .glass i {
        color: #1c6478 !important;
      }
      input {
        color: #173a47;
      }
      input::placeholder {
        color: #8f806f;
      }
      .search-line .btn.primary {
        background: linear-gradient(180deg, #bc4335, #912c26);
        border-color: #a66f35;
      }
      .suggestions {
        border: 2px solid #ac8246;
        background: #fff9e8;
        box-shadow: 0 15px 30px #0b263d50;
      }
      .result {
        background: #fffaed;
      }
      .result:hover,
      .result.active {
        background: #f4e0b2;
      }
      .result + .result {
        border-top-color: #e0c79a;
      }
      .small-avatar {
        border: 1px solid #b38e53;
        background: #f1d8aa;
      }
      .result-meta,
      .status,
      .scroll-note {
        color: #725d41;
      }
      .scroll-note {
        font-weight: 650;
      }
      .win {
        box-shadow: 0 8px 23px #20352820;
      }
      .table-scroll {
        width: 100%;
      }
      table {
        border-spacing: 5px 7px;
      }
      thead th {
        color: #113e53;
        border-bottom: 3px solid #ae7940;
        text-shadow: 0 1px #fff9e7;
        font-weight: 900;
      }
      .tile {
        border: 2px solid rgba(255, 248, 224, 0.65);
        box-shadow:
          inset 0 -8px #091f2c1d,
          0 3px 0 #3b261c24;
        border-radius: 8px;
      }
      .tile.correct {
        background: #208c67;
      }
      .tile.partial {
        background: #e0b13d;
        color: #332a18;
      }
      .tile.wrong {
        background: #bd4039;
      }
      .tile.unknown {
        background: #687b7d;
      }
      .tile.character-tile {
        background: #eac783 !important;
        border-color: #a57839;
        box-shadow:
          inset 0 -5px #73533026,
          0 3px 0 #3b261c24;
      }
      .character-tile img {
        background: #e2ce9b;
      }
      .character-name {
        background: #f6e5bd;
        color: #352819;
      }
      .legend {
        border: 2px solid #b48c56;
        background: linear-gradient(135deg, #fff8e2, #efddb7);
        box-shadow: 0 4px 0 #a87c4a38;
      }
      .legend h3 {
        color: #174357;
      }
      .legend-item {
        color: #44371f;
      }
      .legend-swatch.g {
        background: #208c67;
      }
      .legend-swatch.y {
        background: #e0b13d;
      }
      .legend-swatch.r {
        background: #bd4039;
      }
      .legend-swatch.n {
        background: #687b7d;
      }
      .source {
        color: #eadcb9;
      }
      .source a {
        color: #f4d796;
      }
      @media (max-width: 840px) {
        .head {
          gap: 12px;
        }
        .emblem .mark {
          width: 46px;
          height: 46px;
          flex-basis: 46px;
          font-size: 27px;
        }
        .head h1 {
          font-size: 24px;
        }
        .main::before {
          font-size: 185px;
          top: -70px;
        }
      }
      @media (max-width: 520px) {
        body::after {
          display: none;
        }
        .head {
          padding: 15px 12px;
        }
        .head .actions {
          gap: 7px;
        }
        .head .btn {
          padding: 9px 10px;
        }
        .main {
          padding: 21px 10px;
        }
        .main h2::after {
          margin-top: 6px;
        }
        .search-line {
          gap: 4px;
        }
        .search-line .glass {
          padding-left: 8px;
          font-size: 19px;
        }
        .search-line .btn.primary {
          padding: 9px 8px;
        }
        .legend {
          padding: 13px 10px;
        }
        .legend-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="head">
        <div class="emblem">
          <span class="mark" aria-hidden="true">☠</span>
          <div>
            <h1>OnePiecedle</h1>
          </div>
        </div>
        <div class="actions">
          <a class="btn" href="../index.html" style="text-decoration: none"
            ><i class="fa-solid fa-arrow-left"></i> Tutti i giochi</a
          >
          <button class="btn" id="reveal" type="button">
            <i class="fas fa-lightbulb"></i> Mostra soluzione</button
          ><button class="btn primary" id="newGame" type="button">
            <i
              class="fa-solid fa-rotate-right"
              style="color: rgb(255, 255, 255)"
            ></i>
            Nuova partita
          </button>
        </div>
      </header>
      <main class="main">
        <h2>Indovina il personaggio di One Piece!</h2>

        <div class="search-area">
          <div class="search-line">
            <span class="glass" aria-hidden="true"
              ><i
                class="fa-solid fa-magnifying-glass"
                style="color: rgb(0, 0, 0)"
              ></i></span
            ><input
              id="guessInput"
              type="text"
              placeholder="Cerca un personaggio…"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
              role="combobox"
              aria-autocomplete="list"
              aria-controls="suggestions"
              aria-expanded="false"
              aria-label="Nome del personaggio"
            /><button class="btn primary" id="guessBtn" type="button">
              Prova
              <i
                class="fa-solid fa-paper-plane"
                style="color: rgb(255, 255, 255)"
              ></i>
            </button>
          </div>
          <div
            id="suggestions"
            class="suggestions"
            role="listbox"
            aria-label="Personaggi suggeriti"
          ></div>
        </div>
        <div
          id="status"
          class="status"
          aria-live="polite"
          style="display: none"
        ></div>
        <div id="endPanel" class="win" aria-live="polite">
          <strong id="endTitle"></strong>
          <p id="endText"></p>
          <button type="button" id="playAgain" class="btn primary">
            Gioca ancora
            <i
              class="fa-solid fa-rotate-right"
              style="color: rgb(255, 255, 255)"
            ></i>
          </button>
        </div>
        <div
          class="table-scroll"
          role="region"
          aria-label="Tabella dei tentativi"
          tabindex="0"
        >
          <table>
            <thead>
              <tr>
                <th>Personaggio</th>
                <th>Genere</th>
                <th>Affiliazione</th>
                <th>Frutto del<br />diavolo</th>
                <th>Haki</th>
                <th>Ultima<br />taglia</th>
                <th>Altezza</th>
                <th>Origine</th>
                <th>Primo arco</th>
              </tr>
            </thead>
            <tbody id="guessRows"></tbody>
          </table>
        </div>
        <div class="legend">
          <h3>Legenda degli indizi</h3>
          <div class="legend-grid">
            <div class="legend-item">
              <div class="legend-swatch g"></div>
              Corretto
            </div>
            <div class="legend-item">
              <div class="legend-swatch y"></div>
              Parziale
            </div>
            <div class="legend-item">
              <div class="legend-swatch r"></div>
              Non corretto
            </div>
            <div class="legend-item">
              <div class="legend-swatch r">
                <i
                  class="fa-solid fa-arrow-up"
                  style="color: rgb(255, 255, 255)"
                ></i>
              </div>
              Più alto
            </div>
            <div class="legend-item">
              <div class="legend-swatch r">
                <i
                  class="fa-solid fa-arrow-down"
                  style="color: rgb(255, 255, 255)"
                ></i>
              </div>
              Più basso
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      (() => {
        "use strict";
        const characters = JSON.parse(
          document.getElementById("charactersData").textContent,
        );
        const el = (id) => document.getElementById(id);
        const input = el("guessInput"),
          suggestions = el("suggestions"),
          rows = el("guessRows"),
          status = el("status");
        const imageError = "this.style.opacity='0'";
        const norm = (s) =>
          String(s || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLocaleLowerCase("it")
            .trim();
        const escapeHTML = (s) =>
          String(s == null ? "" : s).replace(
            /[&<>\"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        const pool = [...characters];
        let deck = [],
          secret = null,
          guessed = new Set(),
          won = false,
          finished = false,
          currentOptions = [],
          activeIndex = 0;
        function shuffled(a) {
          const b = [...a];
          for (let i = b.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [b[i], b[j]] = [b[j], b[i]];
          }
          return b;
        }
        function newSecret() {
          if (!deck.length) deck = shuffled(pool);
          let next = deck.pop();
          if (secret && next.id === secret.id && pool.length > 1) {
            if (deck.length) {
              const another = deck.pop();
              deck.push(next);
              next = another;
            } else {
              deck = shuffled(pool.filter((c) => c.id !== secret.id));
            }
          }
          return next;
        }
        function setStatus(msg) {
          status.textContent = msg;
        }
        function closeSuggestions() {
          suggestions.classList.remove("show");
          input.setAttribute("aria-expanded", "false");
          input.removeAttribute("aria-activedescendant");
        }
        function renderSuggestions() {
          if (finished) {
            closeSuggestions();
            return;
          }
          const q = norm(input.value);
          if (!q) {
            closeSuggestions();
            return;
          }
          currentOptions = pool
            .filter(
              (c) =>
                !guessed.has(c.id) &&
                [c.name, ...(c.aliases || [])].some((n) => norm(n).includes(q)),
            )
            .sort((a, b) => {
              const ap = norm(a.name).startsWith(q) ? 0 : 1,
                bp = norm(b.name).startsWith(q) ? 0 : 1;
              return ap - bp || a.name.localeCompare(b.name, "it");
            })
            .slice(0, 9);
          activeIndex = 0;
          if (!currentOptions.length) {
            suggestions.innerHTML =
              '<div class="empty">Nessun personaggio disponibile con questo nome.</div>';
          } else {
            suggestions.innerHTML = currentOptions
              .map(
                (c, i) =>
                  `<button class="result ${i === activeIndex ? "active" : ""}" id="opt-${i}" data-index="${i}" role="option" aria-selected="${i === activeIndex}"><img class="small-avatar" src="${escapeHTML(c.image_url)}" alt="" loading="lazy" onerror="${imageError}"><span><span class="result-name">${escapeHTML(c.name)}</span><br><span class="result-meta">${escapeHTML(c.affiliation)}</span></span></button>`,
              )
              .join("");
          }
          suggestions.classList.add("show");
          input.setAttribute("aria-expanded", "true");
          updateActive();
        }
        function updateActive() {
          suggestions.querySelectorAll(".result").forEach((b, i) => {
            b.classList.toggle("active", i === activeIndex);
            b.setAttribute("aria-selected", String(i === activeIndex));
          });
          if (currentOptions.length) {
            input.setAttribute("aria-activedescendant", "opt-" + activeIndex);
          }
        }
        function pickCharacter(c) {
          if (!c) return;
          input.value = c.name;
          closeSuggestions();
          makeGuess(c);
        }
        function compareScalar(guess, answer) {
          return norm(guess) === norm(answer) ? "correct" : "wrong";
        }
        function hakiTypes(c) {
          return ["observation", "armament", "conqueror"].filter(
            (t) => c.haki && c.haki[t],
          );
        }
        function hakiStatus(g, s) {
          const a = hakiTypes(g),
            b = hakiTypes(s);
          if (a.join("|") === b.join("|")) return "correct";
          if (a.some((x) => b.includes(x))) return "partial";
          return "wrong";
        }
        function hakiLabel(c) {
          const dict = { observation: "👁️", armament: "✊", conqueror: "👑" };
          const types = hakiTypes(c);
          return types.length ? types.map((x) => dict[x]).join(" ") : "Nessuno";
        }
        function statusAttr(x) {
          return x === "correct"
            ? "Corretto"
            : x === "partial"
              ? "Parziale"
              : x === "unknown"
                ? "Sconosciuto"
                : "Non corretto";
        }
        function tile(value, st, extra = "") {
          return `<div class="tile ${st}" title="${statusAttr(st)}">${value}${extra}</div>`;
        }
        function compareNumber(g, s, display, unit = "") {
          if (!Number.isFinite(g) || !Number.isFinite(s))
            return tile(display, "unknown");
          const good = Math.abs(g - s) < 0.0001;
          const arrow = good
            ? ""
            : `<span class="arrow" aria-label="${s > g ? "La risposta è più alta" : "La risposta è più bassa"}">${
                s > g
                  ? `<i
              class="fa-solid fa-arrow-up"
              style="color: rgb(255, 255, 255)"
            ></i>`
                  : `<i
              class="fa-solid fa-arrow-down"
              style="color: rgb(255, 255, 255)"
            ></i>`
              }</span>`;
          return tile(
            `<span class="num">${display}</span>` +
              (unit ? `<span class="tiny">${unit}</span>` : ""),
            good ? "correct" : "wrong",
            arrow,
          );
        }
        function compactBounty(x) {
          if (x === 0) return "0 ฿";
          if (x >= 1e9) return `${numFmt(x / 1e9)} Mld`;
          if (x >= 1e6) return `${numFmt(x / 1e6)} Mln`;
          return x.toLocaleString("it-IT") + " ฿";
        }
        function numFmt(n) {
          return Number(n.toFixed(3)).toLocaleString("it-IT", {
            maximumFractionDigits: 3,
          });
        }
        function numericTile(g, s, label) {
          return compareNumber(g, s, label);
        }
        function arcTile(g, s) {
          if (g.first_arc_order === s.first_arc_order)
            return tile(escapeHTML(g.first_arc), "correct");
          const arrow =
            s.first_arc_order > g.first_arc_order
              ? `<i
              class="fa-solid fa-arrow-up"
              style="color: rgb(255, 255, 255)"
            ></i>`
              : `<i
              class="fa-solid fa-arrow-down"
              style="color: rgb(255, 255, 255)"
            ></i>`;
          return tile(
            escapeHTML(g.first_arc),
            "wrong",
            `<span class="arrow">${arrow}</span>`,
          );
        }
        function makeRow(c) {
          const g = c,
            s = secret,
            truth = g.id === s.id;
          const photo = `<div class="tile character-tile ${truth ? "hit" : ""}" title="${escapeHTML(g.name)}"><img src="${escapeHTML(g.image_url)}" alt="" loading="lazy" onerror="${imageError}"><span class="character-name">${escapeHTML(g.name)}</span></div>`;
          const dev =
            String(g.devil_fruit_type) === "None"
              ? "Nessuno"
              : g.devil_fruit_type;
          const height = g.height_cm
            ? `${numFmt(g.height_cm / 100)} m`
            : "Sconosciuta";
          return `<tr><td>${photo}</td><td>${tile(g.gender === "Male" ? "Maschio" : g.gender === "Female" ? "Femmina" : escapeHTML(g.gender), compareScalar(g.gender, s.gender))}</td><td>${tile(escapeHTML(g.affiliation), compareScalar(g.affiliation, s.affiliation))}</td><td>${tile(escapeHTML(dev), compareScalar(g.devil_fruit_type, s.devil_fruit_type))}</td><td>${tile(hakiLabel(g), hakiStatus(g, s))}</td><td>${numericTile(g.bounty_beli, s.bounty_beli, compactBounty(g.bounty_beli))}</td><td>${compareNumber(g.height_cm || NaN, s.height_cm || NaN, height)}</td><td>${tile(escapeHTML(g.origin), compareScalar(g.origin, s.origin))}</td><td>${arcTile(g, s)}</td></tr>`;
        }
        function makeGuess(c) {
          if (finished) return;
          if (guessed.has(c.id)) {
            setStatus("Hai già provato questo personaggio.");
            return;
          }
          guessed.add(c.id);
          rows.insertAdjacentHTML("afterbegin", makeRow(c));
          input.value = "";
          closeSuggestions();
          if (c.id === secret.id) {
            won = true;
            endGame(true);
          } else {
            setStatus(
              `Tentativi effettuati: ${guessed.size} · Personaggi disponibili: ${pool.length - guessed.size}`,
            );
            input.focus();
          }
        }
        function endGame(success) {
          finished = true;
          input.disabled = true;
          el("guessBtn").disabled = true;
          el("reveal").disabled = true;
          closeSuggestions();
          const win = el("endPanel");
          win.classList.toggle("lost", !success);
          win.classList.add("show");
          el("endTitle").textContent = success
            ? "🎉 Personaggio indovinato!"
            : "🏴‍☠️ Soluzione rivelata";
          el("endText").textContent = success
            ? `Hai trovato ${secret.name} in ${guessed.size} ${guessed.size === 1 ? "tentativo" : "tentativi"}!`
            : `Il personaggio segreto era ${secret.name}. Puoi iniziare subito una nuova partita.`;
          setStatus("");
        }
        function begin() {
          secret = newSecret();
          guessed = new Set();
          won = false;
          finished = false;
          rows.innerHTML = "";
          input.disabled = false;
          el("guessBtn").disabled = false;
          el("reveal").disabled = false;
          el("endPanel").classList.remove("show", "lost");
          input.value = "";
          closeSuggestions();
          setStatus(
            `${pool.length} personaggi da indovinare · Nessun limite di tentativi`,
          );
          input.focus();
        }
        input.addEventListener("input", renderSuggestions);
        input.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            closeSuggestions();
            return;
          }
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            if (
              !currentOptions.length ||
              !suggestions.classList.contains("show")
            )
              return;
            e.preventDefault();
            activeIndex =
              (activeIndex +
                (e.key === "ArrowDown" ? 1 : -1) +
                currentOptions.length) %
              currentOptions.length;
            updateActive();
            suggestions
              .querySelector(".active")
              ?.scrollIntoView({ block: "nearest" });
            return;
          }
          if (e.key === "Enter") {
            e.preventDefault();
            submitGuess();
          }
        });
        suggestions.addEventListener("mousedown", (e) => e.preventDefault());
        suggestions.addEventListener("click", (e) => {
          const hit = e.target.closest(".result");
          if (hit) pickCharacter(currentOptions[Number(hit.dataset.index)]);
        });
        function submitGuess() {
          if (finished) return;
          const q = norm(input.value);
          if (!q) return setStatus("Scrivi il nome di un personaggio.");
          const exact = pool.find(
            (c) =>
              !guessed.has(c.id) &&
              [c.name, ...(c.aliases || [])].some((n) => norm(n) === q),
          );
          if (exact) return pickCharacter(exact);
          if (currentOptions.length && suggestions.classList.contains("show"))
            return pickCharacter(currentOptions[activeIndex]);
          setStatus("Seleziona un personaggio dall’elenco.");
          renderSuggestions();
        }
        el("guessBtn").addEventListener("click", submitGuess);
        el("newGame").addEventListener("click", begin);
        el("playAgain").addEventListener("click", begin);
        el("reveal").addEventListener("click", () => {
          if (!finished) endGame(false);
        });
        document.addEventListener("click", (e) => {
          if (!e.target.closest(".search-area")) closeSuggestions();
        });
        begin();
      })();
    </script>
