<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#b84e24" />
    <script src="https://kit.fontawesome.com/7d86f6057b.js" crossorigin="anonymous"></script>
    <script src="../js/naruto.js" defer></script>
    <link rel="icon" type="image/png" href="../images/logo.png" />
    <link rel="stylesheet" href="../styles/naruto.css" />
    <link rel="manifest" href="../manifest.json" />

    <title>Narutodle</title>
  </head>
  <body>
    <div class="shell">
      <header class="nav">
        <div class="brand">
          <div class="symbol" aria-hidden="true">忍</div>
          <div>
            <h1>Narutodle</h1>
          </div>
        </div>
        <div class="actions">
          <a class="btn" href="../index.html">
            <i class="fa-solid fa-arrow-left" style="color: rgb(113, 55, 36)"></i>
            Tutti i giochi
          </a>
          <button type="button" id="showAnswer" class="btn"><i class="fas fa-lightbulb"></i> Mostra soluzione</button>
          <button type="button" id="restart" class="btn primary">
            <i class="fa-solid fa-rotate-right" style="color: rgb(255, 255, 255)"></i>
            Nuova partita
          </button>
        </div>
      </header>
      <main>
        <h2>Indovina il personaggio di Naruto!</h2>

        <div class="input-wrap">
          <div class="input-line">
            <span class="search-icon" aria-hidden="true">
              <i class="fa-solid fa-magnifying-glass" style="color: rgb(0, 0, 0)"></i>
            </span>
            <input id="guessInput" type="search" placeholder="Cerca un personaggio…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" role="combobox" aria-label="Nome del personaggio" aria-controls="matches" aria-expanded="false" />
            <button type="button" class="btn primary" id="submitGuess">
              Prova
              <i class="fa-solid fa-paper-plane" style="color: rgb(255, 255, 255)"></i>
            </button>
          </div>
          <div class="dropdown" role="listbox" id="matches"></div>
        </div>

        <div id="message" class="msg" role="status" aria-live="polite" style="display: none"></div>
        <div id="result" class="result" aria-live="polite">
          <strong id="resultTitle"></strong>
          <p id="resultText"></p>
          <button id="again" type="button" class="btn primary">
            Gioca ancora
            <i class="fa-solid fa-rotate-right" style="color: rgb(255, 255, 255)"></i>
          </button>
        </div>
        <div class="table-scroll">
          <table aria-label="Tentativi e indizi">
            <thead>
              <tr>
                <th>Personaggio</th>
                <th>Genere</th>
                <th>Affiliazioni</th>
                <th>Tipi di Jutsu</th>
                <th>Kekkei Genkai</th>
                <th>Nature del chakra</th>
                <th>Attributi</th>
                <th>Arco di debutto</th>
              </tr>
            </thead>
            <tbody id="guessRows"></tbody>
          </table>
        </div>
        <div class="legend">
          <h3>Legenda degli indizi</h3>
          <div class="legend-grid">
            <div class="legend-item"><span class="swatch green"></span>Corretto</div>
            <div class="legend-item"><span class="swatch yellow"></span>Parziale</div>
            <div class="legend-item"><span class="swatch red"></span>Non corretto</div>
            <div class="legend-item">
              <span class="swatch red"><i class="fa-solid fa-arrow-up" style="color: rgb(255, 255, 255)"></i></span>Più alto
            </div>
            <div class="legend-item">
              <span class="swatch red"><i class="fa-solid fa-arrow-down" style="color: rgb(255, 255, 255)"></i></span>Più basso
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
