<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#102554" />
    <script src="https://kit.fontawesome.com/7d86f6057b.js" crossorigin="anonymous"></script>
    <script src="../js/dragonball.js" defer></script>
    <link rel="stylesheet" href="../styles/dragonball.css" />
    <title>Dragonballdle</title>
  </head>
  <body>
    <div class="shell">
      <header class="nav">
        <div class="brand">
          <div class="logo">悟</div>
          <div>
            <h1>Dragonballdle</h1>
          </div>
        </div>
        <div class="actions">
          <a href="../index.html" class="btn"><i class="fas fa-arrow-left"></i> Tutti i giochi</a>
          <button type="button" class="btn" id="showAnswer"><i class="fas fa-lightbulb"></i> Mostra soluzione</button>
          <button type="button" class="btn primary" id="restart"><i class="fas fa-rotate-right"></i> Nuova partita</button>
        </div>
      </header>
      <main>
        <h2>Indovina il personaggio di Dragon Ball!</h2>

        <div class="search">
          <div class="input-line">
            <span class="input-icon" aria-hidden="true"><i class="fas fa-magnifying-glass"></i></span>
            <input
              id="guessInput"
              type="text"
              placeholder="Nome del personaggio..."
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              aria-label="Nome del personaggio"
              aria-expanded="false"
              aria-controls="matches"
            />
            <button class="btn primary" type="button" id="submitGuess">Prova <i class="fas fa-paper-plane"></i></button>
          </div>
          <div id="matches" class="dropdown" role="listbox"></div>
        </div>

        <div id="message" class="message" role="status" aria-live="polite" style="display: none"></div>

        <div id="result" class="result">
          <strong id="resultTitle"></strong>
          <p id="resultText"></p>
          <button class="btn primary" id="again" type="button"><i class="fas fa-rotate-right"></i> Gioca ancora</button>
        </div>

        <div class="table-outer">
          <table>
            <thead>
              <tr>
                <th>Personaggio</th>
                <th>Sesso</th>
                <th>Capelli</th>
                <th>Origine</th>
                <th>Razza</th>
                <th>Saga</th>
                <th>Serie</th>
              </tr>
            </thead>
            <tbody id="guessRows"></tbody>
          </table>
        </div>
        <div class="legend">
          <h3>Legenda degli indizi</h3>
          <div class="legend-grid">
            <div class="legend-item"><span class="swatch green"></span>Corretto</div>
            <div class="legend-item"><span class="swatch yellow"></span>Parziale</div>
            <div class="legend-item"><span class="swatch red"></span>Non corretto</div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
