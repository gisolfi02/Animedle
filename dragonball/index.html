<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#5cb5e2" />
    <script
      src="https://kit.fontawesome.com/7d86f6057b.js"
      crossorigin="anonymous"
    ></script>
    <title>Dragonballdle</title>
    <style>
      :root {
        --sky: #69b8e6;
        --ink: #092b41;
        --white: #f9fdff;
        --good: #08b86d;
        --bad: #e54b55;
        --part: #f3b615;
        --line: #4c85ac;
        --shadow: 0 14px 35px #143d5f2c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 9%, #ffefba6e 0 9%, transparent 25%),
          radial-gradient(circle at 93% 74%, #226da35a, transparent 30%),
          linear-gradient(135deg, #5db7ec, #8bd1f1 60%, #5cace5);
      }
      .shell {
        width: min(1220px, calc(100% - 34px));
        margin: 30px auto 60px;
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        border: 2px solid #4788b2;
        border-radius: 16px;
        padding: 16px 20px;
        background: #fffffff0;
        box-shadow: var(--shadow);
      }
      .logo {
        width: 51px;
        height: 51px;
        flex: 0 0 51px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(135deg, #fabc25, #fa6d26);
        border: 3px solid #b15115;
        color: white;
        font-size: 30px;
        font-weight: 1000;
        transform: rotate(-10deg);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 13px;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      h2 {
        font-size: clamp(19px, 2.5vw, 28px);
        text-align: center;
        letter-spacing: 0.5px;
        font-family: Georgia, serif;
        color: #276992;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(22px, 3.2vw, 34px);
        line-height: 1.12;
        color: var(--maroon);
      }
      .sub {
        font-size: 13px;
        color: #597386;
        margin: 6px 0 0;
      }
      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      button,
      .btn {
        font: inherit;
        cursor: pointer;
      }
      .btn {
        border: 1.5px solid #276992;
        background: #ecf8ff;
        border-radius: 9px;
        color: #125177;
        text-decoration: none;
        padding: 10px 14px;
        font-weight: 720;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
      }
      .btn.primary {
        background: #f38420;
        color: #fff;
        border-color: #ba580d;
      }
      .btn:hover {
        background: #ffe8bd;
        transform: translateY(-1px);
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible {
        outline: 3px solid #f5a826;
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      main {
        background: #fffffff0;
        border: 2px solid #4788b2;
        border-radius: 16px;
        padding: 25px 26px;
        margin-top: 21px;
        box-shadow: var(--shadow);
        gap: 20px;
        display: grid;
        align-content: center;
        justify-items: center;
      }
      .lead {
        color: #4e6f82;
        text-align: center;
        font-size: 14px;
        margin: 12px auto 21px;
        line-height: 1.5;
        max-width: 780px;
      }
      .search {
        position: relative;
        max-width: 690px;
        margin: 0 auto;
        z-index: 9;
      }
      .input-line {
        border: 2px solid #5190b4;
        background: white;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px;
        border-radius: 12px;
      }
      .input-icon {
        font-size: 22px;
        padding-left: 11px;
        color: #5c8299;
      }
      #guessInput {
        font-size: 17px;
        padding: 13px 2px;
        border: 0;
        outline: 0;
        flex: 1;
        min-width: 0;
        width: 100%;
        background: transparent;
        color: #153a50;
      }
      #submitGuess {
        flex: 0 0 auto;
      }
      .dropdown {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 5px);
        max-height: 350px;
        overflow-y: auto;
        border: 2px solid #3a88b5;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 15px 28px #07365350;
      }
      .dropdown.open {
        display: block;
      }
      .option {
        width: 100%;
        display: flex;
        gap: 10px;
        align-items: center;
        text-align: left;
        border: 0;
        border-bottom: 1px solid #d8e8f2;
        background: #fff;
        padding: 8px 11px;
        color: var(--ink);
      }
      .option:hover,
      .option.active {
        background: #e1f3ff;
      }
      .option small {
        display: block;
        color: #56788a;
        margin-top: 2px;
      }
      .mini {
        width: 41px;
        height: 41px;
        border-radius: 7px;
        object-fit: cover;
        object-position: top;
        background: #ffdda8;
        border: 1px solid #9cb8c5;
      }
      .mini-place {
        width: 41px;
        height: 41px;
        display: grid;
        place-items: center;
        border-radius: 7px;
        background: #ffdea2;
        font-weight: 900;
      }

      .dropdown .option .mini-place {
        width: 41px;
        height: 41px;
        min-width: 41px;
        flex: 0 0 41px;
        overflow: hidden;
      }

      .dropdown .option .mini-place img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
        max-width: 100%;
        max-height: 100%;
      }

      .message {
        text-align: center;
        color: #35617b;
        font-size: 13px;
        min-height: 22px;
        margin: 13px auto;
      }
      .result {
        display: none;
        text-align: center;
        border: 2px solid #26a776;
        border-radius: 11px;
        background: #ebfff4;
        padding: 16px;
        margin: 18px auto;
        max-width: 680px;
      }
      .result.revealed {
        border-color: #d18f43;
        background: #fff0db;
      }
      .result.open {
        display: block;
      }
      .result strong {
        font-size: 20px;
      }
      .result p {
        margin: 8px 0 12px;
        font-size: 14px;
      }
      .legend {
        max-width: 780px;
        margin: 23px auto 2px;
        border: 1.5px solid #5190b4;
        background: #ffffff;
        border-radius: 13px;
        padding: 14px 16px;
      }
      .legend h3 {
        margin-top: 0px;
        text-align: center;
        margin-bottom: 11px;
        font-family: Georgia, serif;
        font-size: 17px;
      }
      .legend-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .legend-item {
        text-align: center;
        font-size: 12px;
        font-weight: 720;
        line-height: 1.15;
      }
      .swatch {
        display: grid;
        place-items: center;
        font-size: 23px;
        color: #fff;
        width: 36px;
        height: 33px;
        border-radius: 5px;
        margin: 0 auto 5px;
      }
      .swatch.green {
        background: var(--good);
      }
      .swatch.yellow {
        background: var(--part);
        color: #33291d;
      }
      .swatch.red {
        background: var(--bad);
      }
      .data-note {
        text-align: center;
        color: #6c8290;
        font-size: 11px;
        line-height: 1.5;
        margin: 8px auto 13px;
      }
      .scrollhelp {
        display: none;
        text-align: right;
        color: #557c93;
        font-size: 12px;
        margin: 8px 2px;
      }
      .table-outer {
        overflow-x: auto;
        max-width: 100%;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        padding-bottom: 9px;
      }
      table {
        border-collapse: separate;
        border-spacing: 5px;
        width: 100%;
        table-layout: fixed;
        min-width: 830px;
      }
      th {
        border-bottom: 3px solid #276992;
        font-weight: 850;
        text-transform: uppercase;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.22px;
        line-height: 1.15;
        vertical-align: bottom;
        padding: 0 3px 8px;
      }
      th:nth-child(1) {
        width: 112px;
      }
      th:nth-child(2) {
        width: 85px;
      }
      th:nth-child(3) {
        width: 134px;
      }
      th:nth-child(4) {
        width: 128px;
      }
      th:nth-child(5) {
        width: 138px;
      }
      th:nth-child(6) {
        width: 162px;
      }
      th:nth-child(7) {
        width: 133px;
      }
      th:nth-child(8) {
        width: 135px;
      }
      td {
        height: 110px;
        text-align: center;
        padding: 0;
        vertical-align: middle;
      }
      .tile {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        align-content: center;
        gap: 4px;
        width: 100%;
        height: 100%;
        min-height: 105px;
        border: 2px solid #ffffff66;
        border-radius: 9px;
        padding: 7px 5px;
        background: var(--bad);
        font-size: 13px;
        font-weight: 780;
        line-height: 1.22;
        overflow-wrap: anywhere;
        box-shadow: inset 0 -11px #0000000c;
      }
      .tile.correct {
        background: var(--good);
        color: white;
        border-color: #00965b;
      }

      .tile.wrong {
        background: var(--bad);
        color: white;
        border-color: #bd3342;
      }
      .tile.partial {
        background: var(--part);
        color: #ffffff;
        border-color: #d19b0b;
      }
      .tile.portrait {
        padding: 0;
        background: #ecd4a5;
        border-color: #a5714a;
        display: flex;
        flex-direction: column;
        flex-wrap: nowrap;
        gap: 0;
      }
      .tile.portrait.hit {
        border-color: #09a66e;
        box-shadow: inset 0 0 0 3px #08b86d;
      }
      .photo {
        height: 75px;
        width: 100%;
        position: relative;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f4b75d, #b55331);
        overflow: hidden;
        border-top-left-radius: 4px;
        border-top-right-radius: 4px;
      }
      .photo img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: top;
        background: #ead0a2;
      }
      .portrait .name {
        color: #3e2519;
        background: #f6e4c6;
        font-size: 11px;
        width: 100%;
        min-height: 27px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3px 2px;
        border-bottom-left-radius: 5px;
        border-bottom-right-radius: 5px;
        line-height: 1.12;
      }
      .tile .small {
        font-size: 11px;
      }
      .tile .unknown {
        font-style: italic;
        font-weight: 700;
      }
      .series-label {
        font-size: 11px;
        line-height: 1.2;
      }
      .series-label .series-short {
        font-weight: 900;
        display: block;
      }
      .tile.film {
        position: relative;
      }
      .tile.film:before {
        content: "🎞";
        opacity: 0.15;
        font-size: 52px;
        position: absolute;
        pointer-events: none;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .tile.film span {
        z-index: 1;
      }
      .empty {
        text-align: center;
        padding: 22px;
        color: #4e7790;
        font-size: 14px;
      }
      footer {
        text-align: center;
        color: #315b77;
        font-size: 12px;
        line-height: 1.7;
        margin: 21px auto;
        max-width: 850px;
      }

      @media (max-width: 760px) {
        .nav {
          padding: 12px;
          gap: 10px;
          align-items: flex-start;
          flex-direction: column;
        }
        .logo {
          width: 44px;
          height: 44px;
          flex-basis: 44px;
          font-size: 25px;
        }
        .actions {
          width: 100%;
        }
        .actions .btn {
          flex: 1;
        }
        .shell {
          margin: 10px auto 36px;
        }
        main {
          padding: 20px 10px;
        }
        .input-line .btn {
          padding: 10px;
        }
        .scrollhelp {
          display: block;
        }
        .tile {
          min-height: 78px;
        }
        .lead {
          font-size: 13px;
        }
        table {
          min-width: 925px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="nav">
        <div class="brand">
          <div class="logo">悟</div>
          <div>
            <h1>Dragonballdle</h1>
          </div>
        </div>
        <div class="actions">
          <a href="../index.html" class="btn"
            ><i class="fas fa-arrow-left"></i> Tutti i giochi</a
          >
          <button type="button" class="btn" id="showAnswer">
            <i class="fas fa-lightbulb"></i> Mostra soluzione</button
          ><button type="button" class="btn primary" id="restart">
            <i class="fas fa-rotate-right"></i> Nuova partita
          </button>
        </div>
      </header>
      <main>
        <h2>Indovina il personaggio di Dragon Ball!</h2>

        <div class="search">
          <div class="input-line">
            <span class="input-icon" aria-hidden="true"
              ><i class="fas fa-magnifying-glass"></i></span
            ><input
              id="guessInput"
              type="text"
              placeholder="Nome del personaggio..."
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              aria-label="Nome del personaggio"
              aria-expanded="false"
              aria-controls="matches"
            /><button class="btn primary" type="button" id="submitGuess">
              Prova <i class="fas fa-paper-plane"></i>
            </button>
          </div>
          <div id="matches" class="dropdown" role="listbox"></div>
        </div>

        <div id="result" class="result">
          <strong id="resultTitle"></strong>
          <p id="resultText"></p>
          <button class="btn primary" id="again" type="button">
            <i class="fas fa-rotate-right"></i> Gioca ancora
          </button>
        </div>

        <div class="table-outer">
          <table>
            <thead>
              <tr>
                <th>Personaggio</th>
                <th>Sesso</th>
                <th>Capelli</th>
                <th>Origine</th>
                <th>Razza</th>
                <th>Saga</th>
                <th>Serie</th>
              </tr>
            </thead>
            <tbody id="guessRows"></tbody>
          </table>
        </div>
        <div class="legend">
          <h3>Legenda degli indizi</h3>
          <div class="legend-grid">
            <div class="legend-item">
              <span class="swatch green"></span>Corretto
            </div>
            <div class="legend-item">
              <span class="swatch yellow"></span>Parziale
            </div>
            <div class="legend-item">
              <span class="swatch red"></span>Non corretto
            </div>
          </div>
        </div>
      </main>
    </div>

          "episode": "Film",

          "episode_source_status": "preliminare"
        }
      ]
    </script>
    <script>
      (function () {
        "use strict";
        const byId = (s) => document.getElementById(s);
        const inp = byId("guessInput"),
          menu = byId("matches"),
          tbody = byId("guessRows");
        const esc = (x) =>
          String(x ?? "").replace(
            /[&<>"']/g,
            (t) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[t],
          );
        const norm = (s) =>
          String(s ?? "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, " ")
            .trim();
        let pool = [],
          remaining = [],
          secret = null,
          guesses = new Set(),
          ended = false,
          options = [],
          active = 0,
          portraits = new Map();
        const isUrl = (x) => typeof x === "string" && /^https:\/\//.test(x);
        function imgFor(c) {
          return portraits.get(c.name) || c.image_url || "";
        }
        function avatar(c, small) {
          const url = imgFor(c);
          const char = esc((c.name || "?").slice(0, 1).toUpperCase());
          return url
            ? `<img src="${esc(url)}" loading="lazy" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none';this.parentElement.textContent='${char}'">`
            : `<span>${char}</span>`;
        }
        const msg = (s) => (byId("message").textContent = s);
        function shuffle(a) {
          const x = a.slice();
          for (let i = x.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [x[i], x[j]] = [x[j], x[i]];
          }
          return x;
        }
        function getSecret() {
          if (!remaining.length) remaining = shuffle(pool);
          let next = remaining.pop();
          if (secret && next.id === secret.id && pool.length > 1) {
            if (remaining.length) {
              const alt = remaining.pop();
              remaining.push(next);
              next = alt;
            } else {
              remaining = shuffle(pool.filter((c) => c.id !== secret.id));
              next = remaining.pop();
            }
          }
          return next;
        }
        function close() {
          menu.classList.remove("open");
          inp.setAttribute("aria-expanded", "false");
        }
        function search() {
          if (!inp.value.trim() || ended) {
            close();
            return;
          }
          const q = norm(inp.value);
          options = pool
            .filter(
              (c) =>
                !guesses.has(c.id) &&
                [c.name, ...(c.aliases || [])].some((n) => norm(n).includes(q)),
            )
            .sort(
              (a, b) =>
                Number(!norm(a.name).startsWith(q)) -
                  Number(!norm(b.name).startsWith(q)) ||
                a.name.localeCompare(b.name),
            )
            .slice(0, 12);
          active = 0;
          menu.innerHTML = options.length
            ? options
                .map(
                  (c, i) =>
                    `<button type="button" role="option" class="option ${i === 0 ? "active" : ""}" data-i="${i}"><div class="mini-place">${avatar(c, true)}</div><span><strong>${esc(c.name)}</strong><small>${esc(c.series)} · ${esc(c.race)}</small></span></button>`,
                )
                .join("")
            : '<div class="option">Nessun personaggio trovato</div>';
          menu.classList.add("open");
          inp.setAttribute("aria-expanded", "true");
        }
        function equals(a, b) {
          return String(a) === String(b);
        }
        const unset = (v) =>
          v === null ||
          v === undefined ||
          v === "" ||
          v === "Sconosciuto" ||
          v === "Sconosciuta";
        function state(a, b, kind) {
          if (unset(a) || unset(b)) return "wrong";
          if (equals(a, b)) return "correct";
          if (
            kind === "hair" &&
            ["Calvo", "Nessuno"].includes(a) &&
            ["Calvo", "Nessuno"].includes(b)
          )
            return "partial";
          if (kind === "series") {
            const base = (s) => String(s).replace(/ · Film$/, "");
            if (base(a) === base(b)) return "partial";
          }
          return "wrong";
        }
        function tile(v, cls, extra = "") {
          return `<div class="tile ${cls} ${extra}">${v}</div>`;
        }
        function value(v) {
          return v === null || v === undefined ? "?" : esc(v);
        }
        function card(c) {
          const won = c.id === secret.id;
          return tile(
            `<div class="photo">${avatar(c)}</div><span class="name">${esc(c.name)}</span>`,
            "portrait " + (won ? "hit" : ""),
          );
        }
        function cell(c, field, kind) {
          const v = c[field];
          const status =
            c.id === secret.id ? "correct" : state(v, secret[field], kind);
          return tile(
            field === "series"
              ? `<span class="series-label">${value(v)}</span>`
              : value(v),
            status,
            field === "episode" && v === "Film" ? "film" : "",
          );
        }
        function render(c) {
          return `<tr><td>${card(c)}</td><td>${cell(c, "gender")}</td><td>${cell(c, "hair", "hair")}</td><td>${cell(c, "origin")}</td><td>${cell(c, "race")}</td><td>${cell(c, "saga")}</td><td>${cell(c, "series", "series")}</td></tr>`;
        }
        function finish(win) {
          ended = true;
          inp.disabled = true;
          byId("submitGuess").disabled = true;
          byId("showAnswer").disabled = true;
          close();
          byId("result").classList.add("open");
          byId("result").classList.toggle("revealed", !win);
          byId("resultTitle").textContent = win
            ? "🎉 Personaggio indovinato!"
            : "Soluzione rivelata";
          byId("resultText").textContent = win
            ? `Hai indovinato ${secret.name} in ${guesses.size} tentativi!`
            : `Il personaggio segreto era ${secret.name}. Puoi ricominciare quando vuoi.`;
          msg("");
        }
        function guess(c) {
          if (!c || ended) return;
          if (guesses.has(c.id)) {
            msg("Hai già provato questo personaggio.");
            return;
          }
          const first = guesses.size === 0;
          guesses.add(c.id);
          if (first) tbody.innerHTML = "";
          tbody.insertAdjacentHTML("afterbegin", render(c));
          inp.value = "";
          close();
          if (c.id === secret.id) {
            finish(true);
            return;
          }
          msg(
            `${guesses.size} tentativi · ${pool.length - guesses.size} personaggi ancora da provare`,
          );
        }
        function submit() {
          if (ended) return;
          const q = norm(inp.value);
          if (!q) {
            msg("Scrivi un nome.");
            return;
          }
          const exact = pool.find(
            (c) =>
              !guesses.has(c.id) &&
              [c.name, ...(c.aliases || [])].some((v) => norm(v) === q),
          );
          const selected =
            exact ||
            (menu.classList.contains("open") &&
            options.length &&
            norm(options[0].name).startsWith(q)
              ? options[0]
              : null);
          if (selected) guess(selected);
          else {
            msg("Seleziona un personaggio dai suggerimenti.");
            search();
          }
        }
        function begin() {
          if (!pool.length) {
            msg("Nessun personaggio disponibile.");
            return;
          }
          secret = getSecret();
          guesses.clear();
          ended = false;
          tbody.innerHTML = '<tr><td colspan="7" class="empty"></td></tr>';
          inp.value = "";
          inp.disabled = false;
          byId("submitGuess").disabled = false;
          byId("showAnswer").disabled = false;
          byId("result").className = "result";
          close();
          msg(
            `${pool.length} personaggi · Partite infinite · Nessun limite di tentativi`,
          );
        }
        inp.addEventListener("input", search);
        inp.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            close();
            return;
          }
          if (e.key === "Enter") {
            e.preventDefault();
            if (menu.classList.contains("open") && options.length)
              guess(options[active]);
            else submit();
          }
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            if (!menu.classList.contains("open") || !options.length) return;
            e.preventDefault();
            active =
              (active + (e.key === "ArrowDown" ? 1 : -1) + options.length) %
              options.length;
            menu
              .querySelectorAll("button.option")
              .forEach((x, i) => x.classList.toggle("active", i === active));
          }
        });
        menu.addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-i]");
          if (btn) guess(options[Number(btn.dataset.i)]);
        });
        document.addEventListener("click", (e) => {
          if (!e.target.closest(".search")) close();
        });
        byId("submitGuess").addEventListener("click", submit);
        byId("restart").addEventListener("click", begin);
        byId("again").addEventListener("click", begin);
        byId("showAnswer").addEventListener("click", () => {
          if (secret && !ended) finish(false);
        });
        const embedded = JSON.parse(byId("offlineData").textContent);
        // File locale: JSON incorporato. GitHub Pages: carica il file esterno modificabile, con fallback incorporato.
        fetch("./characters.json?v=dragonball-csv-20261024", {
          cache: "no-store",
        })
          .then((r) => {
            if (!r.ok) throw Error(r.status);
            return r.json();
          })
          .catch(() => embedded)
          .then((data) => {
            if (!Array.isArray(data) || data.length === 0)
              throw Error("Il dataset non contiene personaggi");
            pool = data;
            begin();
          })
          .catch((err) => msg("Errore di caricamento: " + err.message));
        // Facoltativo e non bloccante: arricchisce le immagini con la Dragon Ball API pubblica, se raggiungibile.
        // La logica e i dati del gioco non cambiano mai in base all'API esterna.
        fetch("https://dragonball-api.com/api/characters?limit=100", {
          mode: "cors",
        })
          .then((r) => (r.ok ? r.json() : Promise.reject(Error(r.status))))
          .then((data) => {
            const items = Array.isArray(data) ? data : data.items || [];
            if (!Array.isArray(items)) return;
            const map = new Map(
              items
                .filter((x) => x && x.name && isUrl(x.image))
                .map((x) => [norm(x.name), x.image]),
            );
            for (const c of embedded) {
              if (!c.image_url) {
                const match = [c.name, ...(c.aliases || [])]
                  .map(norm)
                  .map((k) => map.get(k))
                  .find(Boolean);
                if (match) portraits.set(c.name, match);
              }
            }
          })
          .catch(() => {});
      })();
    </script>
