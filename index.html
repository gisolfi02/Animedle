<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#171823" />
    <script
      src="https://kit.fontawesome.com/7d86f6057b.js"
      crossorigin="anonymous"
    ></script>
    <title>Animedle</title>
    <style>
      :root {
        --bg: #141722;
        --soft: #242937;
        --ink: #f8f6ef;
        --muted: #b7bdca;
        --line: #494956;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 92% 2%, #5b383663 0 16%, transparent 33%),
          radial-gradient(circle at 5% 84%, #25506a55, transparent 37%),
          var(--bg);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .shell {
        max-width: 1130px;
        width: calc(100% - 36px);
        margin: 0 auto;
        padding: 44px 0 58px;
      }
      .eyebrow {
        color: #edab6e;
        font-size: 12px;
        letter-spacing: 3px;
        text-transform: uppercase;
        font-weight: 850;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: clamp(38px, 6vw, 70px);
        letter-spacing: -1px;
        margin: 10px 0 10px;
        line-height: 1.04;
      }
      p {
        margin: 0;
      }
      .intro {
        color: var(--muted);
        max-width: 680px;
        font-size: clamp(15px, 2vw, 18px);
        line-height: 1.6;
        margin-bottom: 35px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }
      .card {
        border: 1px solid #63534b;
        border-radius: 19px;
        overflow: hidden;
        text-decoration: none;
        color: var(--ink);
        background: linear-gradient(145deg, #30282b, #202535);
        display: flex;
        flex-direction: column;
        min-width: 0;
        box-shadow: 0 18px 35px #0003;
        transition:
          transform 0.16s,
          border 0.16s;
      }
      .card:hover {
        transform: translateY(-4px);
        border-color: #efa361;
      }
      .card:focus-visible {
        outline: 3px solid #f1b65c;
        outline-offset: 3px;
      }
      .banner {
        height: 218px;
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }
      .banner:before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 25% 44%, #ffffff33 0 18%, transparent 19%),
          linear-gradient(130deg, #b13123, #e19142);
        z-index: -2;
      }
      .banner.onepiece::before {
        background:
          linear-gradient(to top, rgba(0, 0, 0, 0.65), transparent 65%),
          url("./images/onepiece.jpg") center / cover no-repeat;
      }
      .banner.naruto:before {
        background:
          linear-gradient(to top, rgba(0, 0, 0, 0.65), transparent 65%),
          url("./images/naruto.jpg") center / cover no-repeat;
      }
      .banner.dragonball:before {
        background:
          linear-gradient(to top, rgba(0, 0, 0, 0.65), transparent 65%),
          url("./images/dragonball.jpg") center / cover no-repeat;
      }
      .later .banner.bleach:before {
        background:
          linear-gradient(to top, rgba(0, 0, 0, 0.65), transparent 65%),
          url("./images/bleach.jpg") center / cover no-repeat;
      }

      .banner img {
        position: absolute;
        right: 13%;
        top: 3px;
        height: 290px;
        max-width: 50%;
        object-fit: contain;
        object-position: top center;
        filter: drop-shadow(0 8px 16px #0007);
      }
      .banner-label {
        position: absolute;
        left: 25px;
        bottom: 24px;
        font-size: clamp(28px, 4vw, 44px);
        font-weight: 940;
        line-height: 1;
        letter-spacing: -1px;
        text-shadow: 0 4px 12px #0007;
        z-index: 1;
      }
      .card-body {
        padding: 20px 22px 22px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .card-body p {
        color: var(--muted);
        font-size: 13px;
        margin-top: 6px;
      }
      .badge {
        font-size: 12px;
        color: #ddf7dd;
        background: #174f36;
        border: 1px solid #3d8062;
        padding: 6px 9px;
        border-radius: 100px;
        white-space: nowrap;
      }
      .enter {
        font-size: 20px;
        border: 1px solid #aa8561;
        border-radius: 50%;
        padding: 5px 6px;
        color: #ffcc92;
      }
      .later {
        opacity: 0.56;
        border: 1px dashed #707484;
        box-shadow: none;
        cursor: default;
      }
      .later .banner:before {
        background: linear-gradient(120deg, #4e425b, #2a3342);
      }
      .later .banner-label {
        color: #ded8ef;
      }
      .later .card-body {
        color: #d1c5b0;
      }
      .later .state {
        border: 1px solid #87899d;
        padding: 5px 9px;
        font-size: 12px;
        border-radius: 100px;
      }
      .footer {
        padding-top: 26px;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.6;
      }
      @media (max-width: 650px) {
        .shell {
          width: calc(100% - 22px);
          padding: 28px 0 45px;
        }
        .grid {
          grid-template-columns: 1fr;
          gap: 15px;
        }
        .banner {
          height: 180px;
        }
        .banner img {
          height: 235px;
          right: 8%;
        }
        .banner-label {
          left: 18px;
          bottom: 21px;
        }
        .card-body {
          padding: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <p class="eyebrow">La tua collezione di giochi</p>
      <h1>Animedle</h1>
      <div class="grid">
        <a
          class="card"
          href="onepiece/index.html"
          aria-label="Gioca a OnePiecedle"
          ><div class="banner onepiece">
            <div class="line-art"></div>
            <span class="banner-label">ONE PIECE</span>
          </div>
          <div class="card-body">
            <div>
              <strong>OnePiecedle</strong>
            </div>
            <span class="enter" aria-hidden="true"
              ><i class="fas fa-arrow-right"></i
            ></span></div
        ></a>
        <a class="card" href="naruto/index.html" aria-label="Gioca a Narutodle"
          ><div class="banner naruto">
            <div class="line-art"></div>
            <span class="banner-label">NARUTO</span>
          </div>
          <div class="card-body">
            <div>
              <strong>Narutodle</strong>
            </div>
            <span class="enter" aria-hidden="true"
              ><i class="fas fa-arrow-right"></i
            ></span></div
        ></a>
        <a
          class="card"
          href="dragonball/index.html"
          aria-label="Gioca a Dragonballdle"
        >
          <div class="banner dragonball">
            <div class="line-art"></div>
            <span class="banner-label">DRAGON BALL</span>
          </div>
          <div class="card-body">
            <div>
              <strong>Dragonballdle</strong>
            </div>
            <span class="enter" aria-hidden="true"
              ><i class="fas fa-arrow-right"></i
            ></span>
          </div>
        </a>
        <div class="card later">
          <div class="banner bleach">
            <div class="line-art"></div>
            <span class="banner-label">BLEACH</span>
          </div>
          <div class="card-body">
            <div>
              <strong>Bleachdle</strong>
              <p>Prossimamente</p>
            </div>
            <span class="state">Da aggiungere</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
